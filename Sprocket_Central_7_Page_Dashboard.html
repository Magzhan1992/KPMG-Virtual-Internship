<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprocket Central | Customer & RFM Analytics</title>
<style>
:root{--navy:#1F2A44;--orange:#E96A2C;--green:#79C943;--bg:#F3F5F8;--card:#fff;--muted:#718096;--line:#E5EAF0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:#182235}
header{background:var(--navy);color:#fff;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:750;letter-spacing:.2px}.subtitle{font-size:12px;color:#c8d0df;margin-top:5px}
.header-right{font-size:12px;color:#d9dfeb;text-align:right}
.shell{max-width:1440px;margin:auto;padding:18px 22px 34px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid #dce2eb;background:#fff;color:var(--navy);padding:10px 13px;border-radius:9px;cursor:pointer;font-weight:650;font-size:12px}
.tab.active{background:var(--orange);border-color:var(--orange);color:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 15px}
h1{font-size:22px;margin:0;color:var(--navy)}.desc{font-size:12px;color:var(--muted);margin-top:5px}
select{padding:9px 12px;border:1px solid #d9e0ea;border-radius:8px;background:white;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:0 2px 7px #14213d08;min-height:93px}
.kpi .label{font-size:11px;color:var(--muted);font-weight:600}.kpi .value{font-size:23px;font-weight:760;color:var(--navy);margin-top:8px;letter-spacing:-.4px}.kpi .note{font-size:10px;color:var(--muted);margin-top:4px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:13px;margin-bottom:13px}
.cols.equal{grid-template-columns:1fr 1fr}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:0 2px 7px #14213d08}
.panel h3{margin:0 0 4px;color:var(--navy);font-size:14px}.panel .hint{color:var(--muted);font-size:10px;margin-bottom:13px}
.chart{width:100%;min-height:230px}.barrow{display:grid;grid-template-columns:minmax(85px,1fr) 2.1fr 72px;gap:9px;align-items:center;margin:12px 0;font-size:11px}
.bartrack{height:12px;background:#edf1f6;border-radius:20px;overflow:hidden}.barfill{height:100%;background:var(--orange);border-radius:20px}
.barfill.navy{background:var(--navy)}.barfill.green{background:var(--green)}
.barvalue{text-align:right;font-variant-numeric:tabular-nums;color:#42516a}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:9px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;color:#627087;background:#f4f6f9;padding:9px}td{padding:9px;border-bottom:1px solid #edf0f4}tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:20px;background:#fff0e8;color:#b84a16;padding:4px 8px;font-size:10px;font-weight:700}
.note-box{background:#fff7ed;border-left:4px solid var(--orange);padding:12px 14px;border-radius:7px;color:#74421c;font-size:12px;line-height:1.5;margin:12px 0}
.good-box{background:#eff8e9;border-left:4px solid var(--green);padding:12px 14px;border-radius:7px;color:#31551c;font-size:12px;line-height:1.5;margin:12px 0}
.footer{font-size:10px;color:#8490a2;margin-top:18px;text-align:right}
.hidden{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.shell{padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.cols,.cols.equal{grid-template-columns:1fr}h1{font-size:19px}}
</style></head>
<body>
